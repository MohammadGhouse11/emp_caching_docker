version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: Ghouse@123
      MYSQL_DATABASE: employee_dto
    ports:
      - "3307:3306"
    networks:
      - spring-net

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - spring-net

  employee-app-caching:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: employee-app-caching
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - mysql
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - spring-net

networks:
  spring-net:
    driver: bridge
